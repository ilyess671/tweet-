# ============================================================================
#  CODE DE GTA VI — un bloc par vidéo
#  Fichiers attendus dans entrees/ :  video-NN.mov (ou .mp4)  et  voix-NN.mp3
# ============================================================================

reglages:                 # valeurs par défaut pour toutes les vidéos
  duree_intro: 5          # secondes de gameplay montrées avant la pause
  volume_jeu_db: 10       # gain du son du jeu (intro)
  volume_suite_db: 8      # gain du son du jeu pendant la suite (baisse auto sous la voix)
  volume_voix_db: 2
  volume_bruitages_db: -4
  revelation_apres: 2.3   # « Réponse X » ~2,3 s après la reprise si revelation_a n'est pas donné

videos:

  - numero: 1
    titre_gameplay: "Braquage à l'épicerie"    # étiquette au-dessus du gameplay
    pause_a: 8.0                                # seconde de l'extrait où on met pause
    revelation_a: 10.25                         # (optionnel) seconde de l'extrait où la réponse se voit
    # suite_depuis: 8.0                          # (optionnel) seconde où « la suite » reprend (défaut : pause_a)
    # suite_ralenti: 0.5                         # (optionnel) la suite est jouée au ralenti (×0,5) si l'extrait est court
    situation: "Jason tente un braquage discret à l'épicerie."
    surligne: [braquage, discret]               # mots surlignés en jaune
    reponses:
      A: "La police attend Jason à la sortie"
      B: "Il se fait désarmer par une gonzesse"
      C: "Le braquage se passe sans souci"
    bonne_reponse: B
    script: |                                   # texte de la voix off (référence)
      [mysterious] Dans cette situation…
      Jason tente un braquage… [whispers] discret… à l'épicerie. [sarcastic] Bon, avec son débardeur et sa coupe mulet, la discrétion, c'est pas gagné.
      A : la police attend Jason à la sortie.
      B : il se fait désarmer par une gonzesse.
      C : [cheerful] le braquage se passe sans souci.
      [excited] À toi de jouer ! T'as cinq secondes.
      [whispers] Regarde bien…
      [laughs] Réponse B ! Désarmé par une gonzesse… [mocking] Jason, t'as braqué l'épicerie ou c'est l'épicerie qui t'a braqué ?
      [warm] Et toi, t'avais trouvé ? Abonne-toi pour la prochaine situation !
    ajustements: {}                             # corrections ponctuelles (voir CLAUDE.md)

  - numero: 2
    titre_gameplay: "Vol de voiture"
    pause_a: 2.0
    revelation_a: 5.0           # la conductrice hurle (« Argh ! Non, non, non ! »)
    situation: "Jason essaie de voler une voiture."
    surligne: [voler, une, voiture]
    reponses:
      A: "Il sort son arme et braque la voiture"
      B: "La police se trouvait juste derrière lui"
      C: "Ce tocard de Jason a encore raté son vol"
    bonne_reponse: C
    script: |                   # validé par l'utilisateur
      [mysterious] Dans cette situation…
      Jason essaie de voler une voiture. [sarcastic] Une voiture de luxe, en plein jour, devant tout le monde… le plan parfait.
      A : il sort son arme et braque la voiture.
      B : la police se trouvait juste derrière lui.
      C : ce tocard de Jason a encore raté son vol.
      [excited] À toi de jouer ! T'as cinq secondes.
      [whispers] Regarde bien…
      [laughs] Réponse C ! Une folle hystérique lui crie dessus comme un petit con. Jason perd tous ses moyens, lol.
      [warm] Et toi, t'avais trouvé ? Abonne-toi pour la prochaine situation !
    ajustements: {}

  - numero: 3
    titre_gameplay: "Balade à vélo"
    pause_a: 2.0
    revelation_a: 2.7           # le coup de pied dans le cycliste
    suite_ralenti: 0.5          # extrait de 5,9 s : la suite passe au ralenti
    suite_depuis: 1.4           # petit replay avant la pause pour que le coup tombe sur « Réponse B »
    situation: "Le bon vieux Jason se balade tranquillement à vélo."
    surligne: [tranquillement, à, vélo]
    reponses:
      A: "Il tente un stunt en mode Lasalle"
      B: "High kick dans la grand-mère du PNJ"
      C: "Il se fait renverser par une voiture"
    bonne_reponse: B
    script: |                   # validé par l'utilisateur
      [mysterious] Dans cette situation…
      Le bon vieux Jason se balade tranquillement à vélo. [sarcastic] Le soleil, la piste cyclable, les petits oiseaux… trop calme pour être honnête.
      A : il tente un stunt en mode Lasalle.
      B : high kick dans la grand-mère du PNJ.
      C : il se fait renverser par une voiture.
      [excited] À toi de jouer ! T'as cinq secondes.
      [whispers] Regarde bien…
      [laughs] Réponse B ! Jason envoie un putain de high kick dans le crâne à ta grand-mère.
      [warm] Et toi, t'avais trouvé ? Abonne-toi pour la prochaine situation !
    ajustements: {}

  - numero: 4
    titre_gameplay: "Accident à vélo"
    pause_a: 4.0                # Jason est au sol, juste avant qu'il se relève
    revelation_a: 5.4           # il se relève et distribue des coups de poing dans le vide
    situation: "Jason se fait renverser à vélo par une voiture."
    surligne: [renverser, à, vélo]
    reponses:                   # A en ligne classique, B et C en tuiles d'image (sans texte)
      A: "TOUT VA BIEN !!!"
      B: {image: reponse-04-B.jpg}   # les chats de Tom & Jerry
      C: {image: reponse-04-C.jpg}   # Popeye
    bonne_reponse: B, C         # deux bonnes réponses
    script: |                   # proposition ; l'utilisateur ajoute un son de mème après « B » et « C »
      [mysterious] Dans cette situation…
      Jason se fait renverser à vélo par une voiture. [sarcastic] Vol plané, roulade, face contre le bitume… la grande classe.
      A : tout va bien !
      B : (son de mème)
      C : (son de mème)
      [excited] À toi de jouer ! T'as cinq secondes.
      [whispers] Regarde bien…
      [laughs] Réponse B et C ! Jason se relève, vénère comme Popeye, prêt à démarrer toutes les voitures qui passent.
      [warm] Et toi, t'avais trouvé ? Abonne-toi pour la prochaine situation !
    ajustements: {}
